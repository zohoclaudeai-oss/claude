.etc-sec .partner-strip{
    display: flex; justify-content: center; align-items: center;
    gap: clamp(14px, 2.2vw, 30px); flex-wrap: wrap; margin-top: 22px;
}
.etc-sec .partner-badge{
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600; color: #374151;
    background: #FFFFFF; border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 18px; box-shadow: 0 2px 10px -6px rgba(16,32,56,.30);
}
@media (max-width: 560px){
    .etc-sec .partner-badge{ font-size: 12.5px; padding: 8px 14px; gap: 8px; }
    .etc-sec .zc-mark{ width: 74px; }
    .etc-sec .zcat-mark{ width: 78px; }
}

/* ── 5. REAL WORLD SCENARIOS: gradient chips replaced ───────────── */
.etc-sec .scenario-detail{
    margin-top: auto; padding: 16px 20px 18px 20px;
    background: var(--ground); border-top: 1px solid var(--line2);
}
.etc-sec .scenario-how{ font-size: 13px; line-height: 1.62; color: var(--ink3); margin: 0; }
.etc-sec .scenario-how strong{ color: var(--ink); font-weight: 700; }
.etc-sec .scenario-keys{ list-style: none; margin: 11px 0 0 0; padding: 0; display: grid; gap: 7px; }
.etc-sec .scenario-keys li{ display: flex; gap: 9px; font-size: 12.5px; line-height: 1.5; color: var(--ink3); }
.etc-sec .scenario-keys i{ color: var(--green-d); font-size: 11px; margin-top: 4px; flex: none; }
.etc-sec .kw-row{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
.etc-sec .kw-row span{
    font-size: 11px; font-weight: 600; color: #475569; background: #FFFFFF;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
}
@media (max-width: 430px){ .etc-sec .scenario-detail{ padding: 13px 16px 15px 16px; } }

/* ── 6. INDUSTRY CARDS ──────────────────────────────────────────── */
.etc-sec .ind-how{ font-size: 13.2px; line-height: 1.62; color: var(--ink3); margin: 8px 0 0 0; }
.etc-sec .ind-how strong{ color: var(--ink); font-weight: 700; }
.etc-sec .ind-flow{ font-size: 11.8px; font-weight: 600; color: var(--blue); margin: 10px 0 0 0; line-height: 1.55; }
.etc-sec .ind-benefit{ font-size: 12.5px; font-weight: 600; color: var(--green-d); margin: 9px 0 0 0; line-height: 1.5; }
.etc-sec .ind-body .kw-row span{ background: var(--ground); }
/* the slides are flex items with only a min-width, so the longer copy below
   would let one card outgrow the others - pin every slide to one track width */
.etc-sec .carousel-track > .ind-card-slide{
    flex: 0 0 calc(33.333% - 14px); max-width: calc(33.333% - 14px);
}
@media (max-width: 991px){
    .etc-sec .carousel-track > .ind-card-slide{ flex-basis: calc(50% - 10px); max-width: calc(50% - 10px); }
}
@media (max-width: 640px){
    .etc-sec .carousel-track > .ind-card-slide{ flex-basis: 100%; max-width: 100%; }
}

/* ── 7. CONTACT: submit button white instead of blue ────────────── */
.etc-sec .ct-form-body input[type="submit"],
.etc-sec .ct-form-body button[type="submit"],
.etc-sec .ct-form-body button,
.etc-sec .ct-form-body .wpcf7-submit,

.etc-sec .ct-form-body .submit-btn{
    background: #FFFFFF !important;
    background-image: none !important;
    background-color: #FFFFFF !important;
    color: #1F2937 !important;
    border: 1.5px solid #D5DBE3 !important;
    box-shadow: 0 6px 18px -12px rgba(16,32,56,.55) !important;
    font-weight: 700 !important;
    border-radius: 10px !important;
    text-shadow: none !important;
    transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease) !important;
}
.etc-sec .ct-form-body input[type="submit"]:hover,
.etc-sec .ct-form-body button[type="submit"]:hover,
.etc-sec .ct-form-body button:hover,
.etc-sec .ct-form-body .wpcf7-submit:hover,
.etc-sec .ct-form-body .wpforms-submit:hover,
.etc-sec .ct-form-body .elementor-button:hover,
.etc-sec .ct-form-body .submit-btn:hover{

/* ── 10. SCROLL REVEAL: every section, and every eyebrow label ──── */
.etc-sec .etc-sec-rise{
    opacity: 0; transform: translateY(36px);
    transition: opacity .85s cubic-bezier(.16,1,.3,1), transform .85s cubic-bezier(.16,1,.3,1);
}
.etc-sec .etc-sec-rise.is-visible{ opacity: 1; transform: none; }
.etc-sec .etc-label-rise{
    opacity: 0; transform: translateY(-12px);
    transition: opacity .6s cubic-bezier(.16,1,.3,1) .12s, transform .6s cubic-bezier(.16,1,.3,1) .12s;
}
.etc-sec .etc-label-rise.is-visible{ opacity: 1; transform: none; }
.etc-sec .etc-item-rise{
    opacity: 0; transform: translateY(18px);
    transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
}
.etc-sec .etc-item-rise.is-visible{ opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){
    .etc-sec .etc-sec-rise, .etc-sec .etc-label-rise, .etc-sec .etc-item-rise{
        opacity: 1 !important; transform: none !important; transition: none !important;
    }
}

<script>
/* Safety net: if an old copy of the height-sync script is still cached or pasted
   somewhere else on the page, strip the inline height it leaves on the video. */
(function () {
    function clear() {
        var w = document.querySelector('#etc-hero .elementor-widget-video .elementor-wrapper');
        if (!w) return;
        w.style.removeProperty('height');
        w.classList.remove('etc-synced');
    }
    clear();
    window.addEventListener('load', clear);
    window.addEventListener('resize', clear);
    [400, 900, 1500, 2500].forEach(function (t) { setTimeout(clear, t); });
})();
</script>
